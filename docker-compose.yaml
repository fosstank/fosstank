services:
  origin:
    image: ghcr.io/fosstank/origin:latest
    build: .
    user: 1000:1000
    container_name: origin
    restart: unless-stopped
    ports:
      - 8090:8090
    environment:
      CDN_ENDPOINT: "${CDN_ENDPOINT:-http://localhost:9000}"
      S3_ENDPOINT: "${S3_ENDPOINT:-minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      PULSE_SERVER: "unix:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native"
    volumes:
      - ./origin/ogn_data:/ogn_data
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native
    depends_on:
      - minio
  uplink:
    image: ghcr.io/fosstank/uplink:latest
    build: .
    user: 1000:1000
    container_name: uplink
    restart: unless-stopped
    ports:
      - 8091:8090
    volumes:
      - ./uplink/pb_data:/pb_data
    environment:
      ORIGIN_URL: "http://origin:8090"
      ORIGIN_API_KEY: "${ORIGIN_API_KEY}"
    depends_on:
      - origin
  tts:
    image: ghcr.io/fosstank/tts:latest
    build: .
    user: 1000:1000
    container_name: tts
    restart: unless-stopped
    ports:
      - 8092:8000
    volumes:
      - model-cache:/home/ubuntu/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  # Minio is only used for testing locally, in production you'll use an actual S3 bucket.
  minio:
    image: minio/minio:latest
    user: 1000:1000
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./s3:/data

volumes:
  model-cache: