services:
  origin:
    image: ghcr.io/fosstank/origin:latest
    build: .
    user: 1000:1000
    container_name: origin
    restart: unless-stopped
    ports:
      - 8090:8090
    environment:
      S3_ENDPOINT: "${S3_ENDPOINT:-minio:9000}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
    volumes:
      - ./origin/ogn_data:/ogn_data
  uplink:
    image: ghcr.io/fosstank/uplink:latest
    build: .
    user: 1000:1000
    container_name: uplink
    restart: unless-stopped
    ports:
      - 8091:8090
    volumes:
      - ./uplink/pb_data:/pb_data
  # Minio is only used for testing locally, in production you'll use an actual S3 bucket.
  minio:
    image: minio/minio:latest
    user: 1000:1000
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - ./s3:/data