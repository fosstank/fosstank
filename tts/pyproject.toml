[project]
name = "tts"
version = "0.1.0"
description = "FastAPI server for generating text to speech audio"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    "nano-vllm-voxcpm>=2.0.0",
    "torch>=2.8.0,<2.9",
    "flash-attn",
]

# Use precompiled flash-attn wheel (Python 3.13, CUDA 12.x, torch 2.8).
[tool.uv.sources]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.8cxx11abiTRUE-cp313-cp313-linux_x86_64.whl" }

